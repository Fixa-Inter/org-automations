name: Configurar novo repositório

on:
  repository_dispatch:
    types:
      - repo-criado

jobs:
  setup:
    name: Configurar repositório
    runs-on: ubuntu-latest

    steps:
      - name: Configurar branches, proteção e workflow
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ORG_AUTOMATION_TOKEN }}

          script: |
            const owner = context.payload.client_payload.org;
            const repo = context.payload.client_payload.repo;

            if (!owner || !repo) {
              throw new Error(
                "Payload inválido: organização ou repositório não informado."
              );
            }

            console.log(`Configurando ${owner}/${repo}`);

            // =====================================================
            // 1. Verificar main
            // =====================================================

            let main;

            try {
              const repository = await github.rest.repos.get({
                owner,
                repo
              });

              console.log(`Repositório encontrado: ${repository.data.full_name}`);
              console.log(`Branch padrão: ${repository.data.default_branch}`);

              const main = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: "main"
              });

              console.log(
                `Main encontrada: ${main.data.name}`
              );

            } catch (error) {
              console.error("ERRO REAL:");
              console.error(`Status: ${error.status}`);
              console.error(`Mensagem: ${error.message}`);
              console.error(error);

              throw error;
            }

            // =====================================================
            // 2. Criar hml caso não exista
            // =====================================================

            try {
              await github.rest.repos.getBranch({
                owner,
                repo,
                branch: "hml"
              });

              console.log("Branch hml já existe.");

            } catch (error) {

              if (error.status !== 404) {
                throw error;
              }

              console.log("Criando branch hml...");

              await github.rest.git.createRef({
                owner,
                repo,
                ref: "refs/heads/hml",
                sha: main.data.commit.sha
              });

              console.log("Branch hml criada.");
            }

            // =====================================================
            // 3. Proteger branches
            // =====================================================

            async function protectBranch(branch) {

              console.log(`Protegendo branch ${branch}...`);

              await github.rest.repos.updateBranchProtection({
                owner,
                repo,
                branch,

                required_status_checks: null,

                enforce_admins: true,

                required_pull_request_reviews: {
                  required_approving_review_count: 1,
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false,
                  require_last_push_approval: false
                },

                restrictions: null,

                required_linear_history: false,
                allow_force_pushes: false,
                allow_deletions: false,
                block_creations: false,
                required_conversation_resolution: false
              });

              console.log(`Branch ${branch} protegida.`);
            }

            await protectBranch("main");
            await protectBranch("hml");

            // =====================================================
            // 4. Criar workflow de release
            // =====================================================

            const releaseWorkflow = [
              "name: Criar Release",
              "",
              "on:",
              "  push:",
              "    branches:",
              "      - main",
              "",
              "jobs:",
              "  release:",
              `    uses: ${owner}/.github/.github/workflows/auto-release.yml@main`,
              "    permissions:",
              "      contents: write",
              ""
            ].join("\n");

            // =====================================================
            // 5. Verificar se release.yml já existe
            // =====================================================

            let existingFile = null;

            try {
              existingFile = await github.rest.repos.getContent({
                owner,
                repo,
                path: ".github/workflows/release.yml"
              });

              console.log("release.yml já existe.");

            } catch (error) {

              if (error.status !== 404) {
                throw error;
              }

              console.log("release.yml ainda não existe.");
            }

            // =====================================================
            // 6. Criar ou atualizar release.yml
            // =====================================================

            const fileParams = {
              owner,
              repo,
              path: ".github/workflows/release.yml",

              message: existingFile
                ? "chore: atualiza workflow de release"
                : "chore: adiciona workflow de release",

              content: Buffer
                .from(releaseWorkflow)
                .toString("base64")
            };

            if (existingFile) {
              fileParams.sha = existingFile.data.sha;
            }

            await github.rest.repos.createOrUpdateFileContents(
              fileParams
            );

            console.log(
              `Workflow release.yml configurado em ${owner}/${repo}.`
            );

            console.log(
              `Configuração concluída para ${owner}/${repo}.`
            );